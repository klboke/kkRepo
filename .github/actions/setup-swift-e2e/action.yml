name: Set up cached Swift E2E clients
description: Restore complete versioned Swift client images and optionally install wrappers

inputs:
  versions:
    description: all, current, 5.7, 5.10, or 6
    required: false
    default: all
  cache_write:
    description: Save complete client images to the GitHub Actions cache
    required: false
    default: "false"
  wrapper_mode:
    description: none, matrix, or single
    required: false
    default: none
  ca_certificate:
    description: Optional run-specific root CA mounted into Swift client containers
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate Swift E2E image inputs
      shell: bash
      env:
        SWIFT_E2E_VERSIONS: ${{ inputs.versions }}
        SWIFT_E2E_WRAPPER_MODE: ${{ inputs.wrapper_mode }}
      run: |
        set -euo pipefail
        case "$SWIFT_E2E_VERSIONS" in
          all|current|5.7|5.10|6) ;;
          *) echo "invalid Swift E2E versions selector: $SWIFT_E2E_VERSIONS" >&2; exit 2 ;;
        esac
        case "$SWIFT_E2E_WRAPPER_MODE" in
          none|matrix|single) ;;
          *) echo "invalid Swift E2E wrapper mode: $SWIFT_E2E_WRAPPER_MODE" >&2; exit 2 ;;
        esac

    - name: Restore Swift 5.7 image archive
      if: inputs.versions == 'all' || inputs.versions == '5.7'
      id: swift57
      uses: actions/cache/restore@v5
      with:
        lookup-only: ${{ inputs.wrapper_mode == 'none' }}
        path: ${{ runner.temp }}/swift-e2e-images/5.7
        key: ${{ runner.os }}-${{ runner.arch }}-swift-image-v2-5.7-${{ hashFiles('scripts/ci/swift-e2e-image/Dockerfile', 'scripts/ci/swift-e2e-image-cache.sh') }}

    - name: Prepare Swift 5.7 image
      if: inputs.versions == 'all' || inputs.versions == '5.7'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.swift57.outputs.cache-hit }}
        WRAPPER_MODE: ${{ inputs.wrapper_mode }}
      run: |
        set -euo pipefail
        cache_dir="$RUNNER_TEMP/swift-e2e-images/5.7"
        if [[ "$CACHE_HIT" != "true" ]]; then
          "$GITHUB_ACTION_PATH/../../../scripts/ci/swift-e2e-image-cache.sh" build 5.7 "$cache_dir"
        elif [[ "$WRAPPER_MODE" != "none" ]]; then
          "$GITHUB_ACTION_PATH/../../../scripts/ci/swift-e2e-image-cache.sh" load 5.7 "$cache_dir"
        fi

    - name: Save Swift 5.7 image archive
      if: (inputs.versions == 'all' || inputs.versions == '5.7') && inputs.cache_write == 'true' && steps.swift57.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/swift-e2e-images/5.7
        key: ${{ runner.os }}-${{ runner.arch }}-swift-image-v2-5.7-${{ hashFiles('scripts/ci/swift-e2e-image/Dockerfile', 'scripts/ci/swift-e2e-image-cache.sh') }}

    - name: Restore Swift 5.10 image archive
      if: inputs.versions == 'all' || inputs.versions == '5.10'
      id: swift510
      uses: actions/cache/restore@v5
      with:
        lookup-only: ${{ inputs.wrapper_mode == 'none' }}
        path: ${{ runner.temp }}/swift-e2e-images/5.10
        key: ${{ runner.os }}-${{ runner.arch }}-swift-image-v2-5.10-${{ hashFiles('scripts/ci/swift-e2e-image/Dockerfile', 'scripts/ci/swift-e2e-image-cache.sh') }}

    - name: Prepare Swift 5.10 image
      if: inputs.versions == 'all' || inputs.versions == '5.10'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.swift510.outputs.cache-hit }}
        WRAPPER_MODE: ${{ inputs.wrapper_mode }}
      run: |
        set -euo pipefail
        cache_dir="$RUNNER_TEMP/swift-e2e-images/5.10"
        if [[ "$CACHE_HIT" != "true" ]]; then
          "$GITHUB_ACTION_PATH/../../../scripts/ci/swift-e2e-image-cache.sh" build 5.10 "$cache_dir"
        elif [[ "$WRAPPER_MODE" != "none" ]]; then
          "$GITHUB_ACTION_PATH/../../../scripts/ci/swift-e2e-image-cache.sh" load 5.10 "$cache_dir"
        fi

    - name: Save Swift 5.10 image archive
      if: (inputs.versions == 'all' || inputs.versions == '5.10') && inputs.cache_write == 'true' && steps.swift510.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/swift-e2e-images/5.10
        key: ${{ runner.os }}-${{ runner.arch }}-swift-image-v2-5.10-${{ hashFiles('scripts/ci/swift-e2e-image/Dockerfile', 'scripts/ci/swift-e2e-image-cache.sh') }}

    - name: Restore Swift 6 image archive
      if: inputs.versions == 'all' || inputs.versions == 'current' || inputs.versions == '6'
      id: swift6
      uses: actions/cache/restore@v5
      with:
        lookup-only: ${{ inputs.wrapper_mode == 'none' }}
        path: ${{ runner.temp }}/swift-e2e-images/6
        key: ${{ runner.os }}-${{ runner.arch }}-swift-image-v2-6-${{ hashFiles('scripts/ci/swift-e2e-image/Dockerfile', 'scripts/ci/swift-e2e-image-cache.sh') }}

    - name: Prepare Swift 6 image
      if: inputs.versions == 'all' || inputs.versions == 'current' || inputs.versions == '6'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.swift6.outputs.cache-hit }}
        WRAPPER_MODE: ${{ inputs.wrapper_mode }}
      run: |
        set -euo pipefail
        cache_dir="$RUNNER_TEMP/swift-e2e-images/6"
        if [[ "$CACHE_HIT" != "true" ]]; then
          "$GITHUB_ACTION_PATH/../../../scripts/ci/swift-e2e-image-cache.sh" build 6 "$cache_dir"
        elif [[ "$WRAPPER_MODE" != "none" ]]; then
          "$GITHUB_ACTION_PATH/../../../scripts/ci/swift-e2e-image-cache.sh" load 6 "$cache_dir"
        fi

    - name: Save Swift 6 image archive
      if: (inputs.versions == 'all' || inputs.versions == 'current' || inputs.versions == '6') && inputs.cache_write == 'true' && steps.swift6.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/swift-e2e-images/6
        key: ${{ runner.os }}-${{ runner.arch }}-swift-image-v2-6-${{ hashFiles('scripts/ci/swift-e2e-image/Dockerfile', 'scripts/ci/swift-e2e-image-cache.sh') }}

    - name: Release restored image archives after loading
      if: inputs.cache_write != 'true'
      shell: bash
      run: rm -rf "$RUNNER_TEMP/swift-e2e-images"

    - name: Install Swift E2E wrappers
      if: inputs.wrapper_mode != 'none'
      shell: bash
      env:
        SWIFT_E2E_WRAPPER_MODE: ${{ inputs.wrapper_mode }}
        SWIFT_E2E_WRAPPER_CA_CERTIFICATE: ${{ inputs.ca_certificate }}
      run: >-
        "$GITHUB_ACTION_PATH/../../../scripts/ci/setup-swift-e2e-wrappers.sh"
        "$SWIFT_E2E_WRAPPER_MODE"
        "$SWIFT_E2E_WRAPPER_CA_CERTIFICATE"
