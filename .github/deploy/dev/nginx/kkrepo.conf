# Internal dev reverse proxy configuration.
log_format kkrepo_upstream '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                           'upstream="$upstream_addr" upstream_status="$upstream_status" '
                           'request_time=$request_time upstream_time="$upstream_response_time"';

upstream kkrepo_app {
    # Default round-robin with equal weights sends 50% of new requests to each runtime.
    server 127.0.0.1:8080 weight=1 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8090 weight=1 max_fails=1 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://kkrepo.cn$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name kkrepo.cn www.kkrepo.cn;
    access_log /var/log/nginx/access.log kkrepo_upstream;

    ssl_certificate /etc/nginx/tls/kkrepo.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/tls/kkrepo.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 0;
    client_body_timeout 600s;
    send_timeout 600s;

    location / {
        proxy_pass http://kkrepo_app;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_redirect http://kkrepo.cn/ https://kkrepo.cn/;
        proxy_redirect http://www.kkrepo.cn/ https://www.kkrepo.cn/;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
    }
}
