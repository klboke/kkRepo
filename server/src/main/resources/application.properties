kkrepo.cache.basic-auth.enabled=${KKREPO_CACHE_BASIC_AUTH_ENABLED:true}
kkrepo.cache.basic-auth.ttl-seconds=${KKREPO_CACHE_BASIC_AUTH_TTL_SECONDS:120}
kkrepo.cache.basic-auth.missing-ttl-seconds=${KKREPO_CACHE_BASIC_AUTH_MISSING_TTL_SECONDS:5}
kkrepo.proxy.negative-cache.enabled=${KKREPO_PROXY_NEGATIVE_CACHE_ENABLED:${KKREPO_MAVEN_PROXY_NEGATIVE_CACHE_ENABLED:true}}
kkrepo.proxy.negative-cache.ttl-minutes=${KKREPO_PROXY_NEGATIVE_CACHE_TTL_MINUTES:${KKREPO_MAVEN_PROXY_NEGATIVE_CACHE_TTL_MINUTES:5}}
# DNS-pinned outbound connections currently use HTTP/1.1.
# HTTP_2 is accepted but downgraded with a warning.
kkrepo.proxy.remote-http-version=${KKREPO_PROXY_REMOTE_HTTP_VERSION:HTTP_1_1}
kkrepo.proxy.search-timeout-seconds=${KKREPO_PROXY_SEARCH_TIMEOUT_SECONDS:${KKREPO_NPM_PROXY_SEARCH_TIMEOUT_SECONDS:30}}
kkrepo.proxy.metadata-timeout-seconds=${KKREPO_PROXY_METADATA_TIMEOUT_SECONDS:${KKREPO_MAVEN_PROXY_GET_TIMEOUT_SECONDS:60}}
kkrepo.proxy.content-timeout-seconds=${KKREPO_PROXY_CONTENT_TIMEOUT_SECONDS:${KKREPO_PROXY_GET_TIMEOUT_SECONDS:${KKREPO_MAVEN_PROXY_GET_TIMEOUT_SECONDS:120}}}
kkrepo.proxy.head-timeout-seconds=${KKREPO_PROXY_HEAD_TIMEOUT_SECONDS:${KKREPO_MAVEN_PROXY_HEAD_TIMEOUT_SECONDS:5}}
kkrepo.proxy.body-read-retry-attempts=${KKREPO_PROXY_BODY_READ_RETRY_ATTEMPTS:${KKREPO_MAVEN_PROXY_BODY_READ_RETRY_ATTEMPTS:1}}

kkrepo.security.token-header=X-Nexus-Plus-Token
# Coarse-grained compatibility switch for Nexus web UI internals: Rapture,
# ExtDirect, Wonderland, internal UI REST routes, and iframe-style component
# upload. Keep disabled for normal deployments; enable before service startup
# only for Nexus legacy-route compatibility validation.
kkrepo.nexus.legacy-ui.enabled=${KKREPO_NEXUS_LEGACY_UI_ENABLED:false}
# Secrets for reversible encryption of credentials/tokens at rest. Required outside the
# dev/test profiles (enforced by EncryptionSecretsVerifier); set strong, stable values.
# credential-secret covers blob-store S3 keys and auth-realm secrets (OIDC clientSecret,
# LDAP bind passwords); api-key-payload-secret covers user-facing API-key tokens.
kkrepo.security.encryption.credential-secret=${KKREPO_CREDENTIAL_SECRET:}
kkrepo.security.encryption.api-key-payload-secret=${KKREPO_API_KEY_PAYLOAD_SECRET:}
kkrepo.security.default-authenticated-role-id=${KKREPO_DEFAULT_AUTHENTICATED_ROLE_ID:nx-anonymous}
kkrepo.security.authorization-cache.enabled=${KKREPO_SECURITY_AUTHORIZATION_CACHE_ENABLED:true}
kkrepo.security.authorization-cache.ttl-minutes=${KKREPO_SECURITY_AUTHORIZATION_CACHE_TTL_MINUTES:10}
kkrepo.security.authorization-cache.version-local-ttl-seconds=${KKREPO_SECURITY_AUTHORIZATION_CACHE_VERSION_LOCAL_TTL_SECONDS:2}
# Node-local immutable catalog snapshots such as security grants/privileges/repository targets and
# blob_store metadata. Mutations refresh the editing node after commit and bump a shared-database
# watermark so sibling replicas reload on the next poll; scheduled JDBC sync is the safety net
# for missed changes or external database writes.
kkrepo.catalog-cache.enabled=${KKREPO_CATALOG_CACHE_ENABLED:true}
kkrepo.catalog-cache.refresh-interval-ms=${KKREPO_CATALOG_CACHE_REFRESH_INTERVAL_MS:60000}
kkrepo.catalog-cache.initial-delay-ms=${KKREPO_CATALOG_CACHE_INITIAL_DELAY_MS:60000}
# Supported values: jdbc, none. The deprecated mysql alias remains accepted.
kkrepo.catalog-cache.broadcast-backend=${KKREPO_CATALOG_CACHE_BROADCAST_BACKEND:jdbc}
kkrepo.catalog-cache.jdbc.poll-delay-ms=${KKREPO_CATALOG_CACHE_JDBC_POLL_DELAY_MS:${KKREPO_CATALOG_CACHE_MYSQL_POLL_DELAY_MS:500}}
kkrepo.catalog-cache.jdbc.initial-delay-ms=${KKREPO_CATALOG_CACHE_JDBC_INITIAL_DELAY_MS:${KKREPO_CATALOG_CACHE_MYSQL_INITIAL_DELAY_MS:500}}
kkrepo.catalog-cache.jdbc.initial-jitter-ms=${KKREPO_CATALOG_CACHE_JDBC_INITIAL_JITTER_MS:${KKREPO_CATALOG_CACHE_MYSQL_INITIAL_JITTER_MS:100}}
kkrepo.security.hsts-enabled=${KKREPO_HSTS_ENABLED:false}
kkrepo.security.external-base-url=${KKREPO_EXTERNAL_BASE_URL:}
kkrepo.security.csrf.cookie-secure=${KKREPO_CSRF_COOKIE_SECURE:false}
kkrepo.security.outbound.allow-private-addresses=${KKREPO_OUTBOUND_ALLOW_PRIVATE_ADDRESSES:false}
kkrepo.security.outbound.allowed-hosts=${KKREPO_OUTBOUND_ALLOWED_HOSTS:}
kkrepo.security.forwarded-headers.trusted-proxies=${KKREPO_TRUSTED_PROXIES:}
kkrepo.security.rate-limit.login-per-minute=${KKREPO_LOGIN_RATE_LIMIT_PER_MINUTE:20}
kkrepo.security.rate-limit.bootstrap-per-minute=${KKREPO_BOOTSTRAP_RATE_LIMIT_PER_MINUTE:5}
kkrepo.security.authentication-ticket-ttl-seconds=${KKREPO_AUTHENTICATION_TICKET_TTL_SECONDS:300}
kkrepo.security.authentication-ticket-cleanup-interval-ms=${KKREPO_AUTHENTICATION_TICKET_CLEANUP_INTERVAL_MS:60000}
kkrepo.security.authentication-ticket-cleanup-initial-delay-ms=${KKREPO_AUTHENTICATION_TICKET_CLEANUP_INITIAL_DELAY_MS:60000}
kkrepo.security.upload.max-request-bytes=${KKREPO_UPLOAD_MAX_REQUEST_BYTES:1073741824}

# Expired Docker bearer tokens are cleaned independently of upload-staging cleanup. Every replica
# may claim a bounded batch through the shared database; there is intentionally no disable switch.
kkrepo.docker.auth-token-cleanup.interval-ms=${KKREPO_DOCKER_AUTH_TOKEN_CLEANUP_INTERVAL_MS:60000}
kkrepo.docker.auth-token-cleanup.initial-delay-ms=${KKREPO_DOCKER_AUTH_TOKEN_CLEANUP_INITIAL_DELAY_MS:60000}
kkrepo.docker.auth-token-cleanup.batch-size=${KKREPO_DOCKER_AUTH_TOKEN_CLEANUP_BATCH_SIZE:256}
kkrepo.docker.auth-token-cleanup.max-items-per-run=${KKREPO_DOCKER_AUTH_TOKEN_CLEANUP_MAX_ITEMS_PER_RUN:4096}

# Deployment capability gate for optional artifact security scanning. With the default false value,
# upgrades apply only versioned schema changes (including generic blob-reference bookkeeping);
# kkRepo does not emit scan input events, traverse existing assets as scan input, run scan
# maintenance, or query scan policy on download paths. This property does not start the external
# scanner adapter.
#
# Setting it to true is an explicit operational opt-in: kkRepo emits generic content-change events,
# starts bounded event projection and historical reconciliation, runs scan maintenance, and enables
# download-policy integration. Administrators must still activate each repository in Admin UI;
# repository activation creates its durable historical backfill and actual scan tasks.
# Keep disabled until the adapter is deployed, its service credential is configured, and the
# database/scanner capacity has been planned for reconciliation and backfill.
# The relational database owns candidate, task, lease, snapshot, finding, waiver, and materialized
# policy state so replicas may safely share work.
kkrepo.security-scanning.enabled=${KKREPO_SECURITY_SCANNING_ENABLED:false}
kkrepo.security-scanning.adapter.base-url=${KKREPO_SECURITY_SCANNING_ADAPTER_BASE_URL:http://scanner:8080}
kkrepo.security-scanning.adapter.service-credential=${KKREPO_SECURITY_SCANNING_SERVICE_CREDENTIAL:}
kkrepo.security-scanning.adapter.connect-timeout=${KKREPO_SECURITY_SCANNING_CONNECT_TIMEOUT:10s}
# The adapter embeds bounded raw SBOM/report bytes as Base64 and also returns bounded projections.
# Responses are parsed with independent byte, token, nesting, string, and projection limits. The
# process-local memory budget is validated against the resulting decoded-allocation envelope and
# limits how many decoded responses may be live at once.
kkrepo.security-scanning.max-response-bytes=${KKREPO_SECURITY_SCANNING_MAX_RESPONSE_BYTES:67108864}
kkrepo.security-scanning.max-response-tokens=${KKREPO_SECURITY_SCANNING_MAX_RESPONSE_TOKENS:262144}
kkrepo.security-scanning.response-memory-budget-bytes=${KKREPO_SECURITY_SCANNING_RESPONSE_MEMORY_BUDGET_BYTES:268435456}
kkrepo.security-scanning.metrics-count-limit=${KKREPO_SECURITY_SCANNING_METRICS_COUNT_LIMIT:10000}
kkrepo.security-scanning.scanner-database-max-age=${KKREPO_SECURITY_SCANNING_DATABASE_MAX_AGE:48h}
kkrepo.security-scanning.scanner-observation-max-age=${KKREPO_SECURITY_SCANNING_OBSERVATION_MAX_AGE:2m}
kkrepo.security-scanning.oci-registry-url=${KKREPO_SECURITY_SCANNING_OCI_REGISTRY_URL:http://kkrepo:8080}
kkrepo.security-scanning.worker.batch-size=${KKREPO_SECURITY_SCANNING_WORKER_BATCH_SIZE:4}
kkrepo.security-scanning.worker.lease-seconds=${KKREPO_SECURITY_SCANNING_WORKER_LEASE_SECONDS:300}
kkrepo.security-scanning.worker.heartbeat-seconds=${KKREPO_SECURITY_SCANNING_WORKER_HEARTBEAT_SECONDS:60}
kkrepo.security-scanning.worker.max-attempts=${KKREPO_SECURITY_SCANNING_WORKER_MAX_ATTEMPTS:5}
kkrepo.security-scanning.worker.max-backoff-seconds=${KKREPO_SECURITY_SCANNING_WORKER_MAX_BACKOFF_SECONDS:1800}
kkrepo.security-scanning.worker.artifact-change-batch-size=${KKREPO_SECURITY_SCANNING_ARTIFACT_CHANGE_BATCH_SIZE:1000}
kkrepo.security-scanning.worker.artifact-change-cleanup-batch-size=${KKREPO_SECURITY_SCANNING_ARTIFACT_CHANGE_CLEANUP_BATCH_SIZE:5000}
kkrepo.security-scanning.worker.artifact-reconcile-batch-size=${KKREPO_SECURITY_SCANNING_ARTIFACT_RECONCILE_BATCH_SIZE:1000}
kkrepo.security-scanning.worker.artifact-reconcile-recent-window=${KKREPO_SECURITY_SCANNING_ARTIFACT_RECONCILE_RECENT_WINDOW:1d}
kkrepo.security-scanning.worker.candidate-batch-size=${KKREPO_SECURITY_SCANNING_CANDIDATE_BATCH_SIZE:500}
kkrepo.security-scanning.worker.backfill-batch-size=${KKREPO_SECURITY_SCANNING_BACKFILL_BATCH_SIZE:500}
kkrepo.security-scanning.worker.backfill-max-pages-per-run=${KKREPO_SECURITY_SCANNING_BACKFILL_MAX_PAGES_PER_RUN:20}
kkrepo.security-scanning.worker.snapshot-rematch-batch-size=${KKREPO_SECURITY_SCANNING_SNAPSHOT_REMATCH_BATCH_SIZE:200}
kkrepo.security-scanning.worker.snapshot-rematch-max-batches=${KKREPO_SECURITY_SCANNING_SNAPSHOT_REMATCH_MAX_BATCHES:10}
kkrepo.security-scanning.candidate-delay-ms=${KKREPO_SECURITY_SCANNING_CANDIDATE_DELAY_MS:1000}
kkrepo.security-scanning.artifact-change-delay-ms=${KKREPO_SECURITY_SCANNING_ARTIFACT_CHANGE_DELAY_MS:1000}
kkrepo.security-scanning.artifact-reconcile-delay-ms=${KKREPO_SECURITY_SCANNING_ARTIFACT_RECONCILE_DELAY_MS:1000}
kkrepo.security-scanning.task-delay-ms=${KKREPO_SECURITY_SCANNING_TASK_DELAY_MS:1000}
kkrepo.security-scanning.backfill-delay-ms=${KKREPO_SECURITY_SCANNING_BACKFILL_DELAY_MS:1000}
kkrepo.security-scanning.initial-delay-ms=${KKREPO_SECURITY_SCANNING_INITIAL_DELAY_MS:5000}
kkrepo.security-scanning.snapshot-watch-delay=${KKREPO_SECURITY_SCANNING_SNAPSHOT_WATCH_DELAY:60s}
kkrepo.security-scanning.snapshot-watch-initial-delay=${KKREPO_SECURITY_SCANNING_SNAPSHOT_WATCH_INITIAL_DELAY:15s}
kkrepo.security-scanning.metrics-refresh=${KKREPO_SECURITY_SCANNING_METRICS_REFRESH:15s}
kkrepo.security-scanning.policy-reconcile-delay=${KKREPO_SECURITY_SCANNING_POLICY_RECONCILE_DELAY:60s}
kkrepo.security-scanning.policy-reconcile-initial-delay=${KKREPO_SECURITY_SCANNING_POLICY_RECONCILE_INITIAL_DELAY:20s}
kkrepo.security-scanning.retention.enabled=${KKREPO_SECURITY_SCANNING_RETENTION_ENABLED:true}
kkrepo.security-scanning.retention.terminal-task-days=${KKREPO_SECURITY_SCANNING_TERMINAL_TASK_RETENTION_DAYS:30}
kkrepo.security-scanning.retention.result-days=${KKREPO_SECURITY_SCANNING_RESULT_RETENTION_DAYS:90}
kkrepo.security-scanning.retention.batch-size=${KKREPO_SECURITY_SCANNING_RETENTION_BATCH_SIZE:200}
kkrepo.security-scanning.retention.delay=${KKREPO_SECURITY_SCANNING_RETENTION_DELAY:1h}
kkrepo.security-scanning.retention.initial-delay=${KKREPO_SECURITY_SCANNING_RETENTION_INITIAL_DELAY:5m}

# Resolve servlet multipart bodies only when a handler requests them. Ansible Galaxy publication
# uses a bounded streaming reader because ansible-galaxy 2.9 emits a legacy file disposition that
# servlet multipart parsers otherwise discard before the repository handler can inspect it.
spring.servlet.multipart.resolve-lazily=true
kkrepo.ansible.archive.max-compressed-bytes=${KKREPO_ANSIBLE_ARCHIVE_MAX_COMPRESSED_BYTES:1073741824}
kkrepo.ansible.multipart.max-overhead-bytes=${KKREPO_ANSIBLE_MULTIPART_MAX_OVERHEAD_BYTES:1048576}
kkrepo.ansible.archive.max-concurrent-inspections=${KKREPO_ANSIBLE_ARCHIVE_MAX_CONCURRENT_INSPECTIONS:4}
kkrepo.ansible.archive.inspection-permit-wait-ms=${KKREPO_ANSIBLE_ARCHIVE_INSPECTION_PERMIT_WAIT_MS:5000}
kkrepo.ansible.import-worker.concurrency=${KKREPO_ANSIBLE_IMPORT_WORKER_CONCURRENCY:4}
kkrepo.cache.ansible-version-list.enabled=${KKREPO_CACHE_ANSIBLE_VERSION_LIST_ENABLED:true}
kkrepo.ansible.cleanup.enabled=${KKREPO_ANSIBLE_CLEANUP_ENABLED:true}
kkrepo.ansible.cleanup.interval-ms=${KKREPO_ANSIBLE_CLEANUP_INTERVAL_MS:60000}
kkrepo.ansible.cleanup.initial-delay-ms=${KKREPO_ANSIBLE_CLEANUP_INITIAL_DELAY_MS:60000}
kkrepo.ansible.cleanup.batch-size=${KKREPO_ANSIBLE_CLEANUP_BATCH_SIZE:256}
kkrepo.ansible.cleanup.max-batches=${KKREPO_ANSIBLE_CLEANUP_MAX_BATCHES:8}
kkrepo.ansible.cleanup.proxy-page-retention-hours=${KKREPO_ANSIBLE_PROXY_PAGE_RETENTION_HOURS:24}
kkrepo.ansible.cleanup.terminal-task-retention-days=${KKREPO_ANSIBLE_TERMINAL_TASK_RETENTION_DAYS:30}
kkrepo.ansible.cleanup.expired-lease-retention-days=${KKREPO_ANSIBLE_EXPIRED_LEASE_RETENTION_DAYS:7}

# Tier-1 tuning: wide connection pool for metadata-heavy artifact traffic (many concurrent
# small GETs). Portable across all S3-compatible stores (AWS S3, MinIO, OSS, COS, OBS).
kkrepo.storage.s3.max-connections=${KKREPO_S3_MAX_CONNECTIONS:512}
kkrepo.storage.s3.connection-timeout-ms=${KKREPO_S3_CONNECTION_TIMEOUT_MS:5000}
kkrepo.storage.s3.socket-timeout-ms=${KKREPO_S3_SOCKET_TIMEOUT_MS:120000}
kkrepo.storage.s3.connection-acquisition-timeout-ms=${KKREPO_S3_CONNECTION_ACQUISITION_TIMEOUT_MS:10000}
kkrepo.storage.s3.tcp-keep-alive=${KKREPO_S3_TCP_KEEP_ALIVE:true}
kkrepo.storage.s3.multipart-threshold-bytes=${KKREPO_S3_MULTIPART_THRESHOLD_BYTES:67108864}
kkrepo.storage.s3.multipart-part-size-bytes=${KKREPO_S3_MULTIPART_PART_SIZE_BYTES:16777216}
kkrepo.storage.s3.multipart-concurrency=${KKREPO_S3_MULTIPART_CONCURRENCY:4}
kkrepo.blob.transfer-buffer-size-bytes=${KKREPO_BLOB_TRANSFER_BUFFER_SIZE_BYTES:1048576}
kkrepo.storage.file.enabled=${KKREPO_FILE_ENABLED:true}
kkrepo.storage.file.base-dir=${KKREPO_FILE_BASE_DIR:blobs}
# File blob stores are valid in distributed deployments only when every replica mounts the
# same strong-consistency shared filesystem (for example NAS). In prod/production profile,
# both flags below must be true before admins can create or update file blob stores.
kkrepo.storage.file.production-enabled=${KKREPO_FILE_PRODUCTION_ENABLED:false}
kkrepo.storage.file.shared-filesystem=${KKREPO_FILE_SHARED_FILESYSTEM:false}
kkrepo.storage.file.temp-cleanup-enabled=${KKREPO_FILE_TEMP_CLEANUP_ENABLED:true}
kkrepo.storage.file.temp-cleanup-interval-ms=${KKREPO_FILE_TEMP_CLEANUP_INTERVAL_MS:300000}
kkrepo.storage.file.temp-cleanup-grace-seconds=${KKREPO_FILE_TEMP_CLEANUP_GRACE_SECONDS:86400}

# Swift archive inspection retains only package manifests in memory. Bound both the count and
# aggregate bytes independently of the much larger streamed archive expansion ceiling.
kkrepo.swift.archive.max-manifests=${KKREPO_SWIFT_ARCHIVE_MAX_MANIFESTS:64}
kkrepo.swift.archive.max-manifest-total-bytes=${KKREPO_SWIFT_ARCHIVE_MAX_MANIFEST_TOTAL_BYTES:16777216}
# Publication staging rows are shared durable state. Every replica may claim expired rows with
# database row locks; the global blob GC removes bytes after the last asset reference is unlinked.
kkrepo.swift.staging-cleanup.enabled=${KKREPO_SWIFT_STAGING_CLEANUP_ENABLED:true}
kkrepo.swift.staging-cleanup.interval-ms=${KKREPO_SWIFT_STAGING_CLEANUP_INTERVAL_MS:300000}
kkrepo.swift.staging-cleanup.initial-delay-ms=${KKREPO_SWIFT_STAGING_CLEANUP_INITIAL_DELAY_MS:120000}
kkrepo.swift.staging-cleanup.batch-size=${KKREPO_SWIFT_STAGING_CLEANUP_BATCH_SIZE:64}
kkrepo.swift.staging-cleanup.grace-seconds=${KKREPO_SWIFT_STAGING_CLEANUP_GRACE_SECONDS:86400}
kkrepo.ansible.staging-cleanup.enabled=${KKREPO_ANSIBLE_STAGING_CLEANUP_ENABLED:true}
kkrepo.ansible.staging-cleanup.interval-ms=${KKREPO_ANSIBLE_STAGING_CLEANUP_INTERVAL_MS:300000}
kkrepo.ansible.staging-cleanup.initial-delay-ms=${KKREPO_ANSIBLE_STAGING_CLEANUP_INITIAL_DELAY_MS:120000}
kkrepo.ansible.staging-cleanup.batch-size=${KKREPO_ANSIBLE_STAGING_CLEANUP_BATCH_SIZE:64}
kkrepo.ansible.staging-cleanup.grace-seconds=${KKREPO_ANSIBLE_STAGING_CLEANUP_GRACE_SECONDS:86400}

kkrepo.repository-index-rebuild.enabled=${KKREPO_REPOSITORY_INDEX_REBUILD_ENABLED:true}
kkrepo.repository-index-rebuild.poll-interval-ms=${KKREPO_REPOSITORY_INDEX_REBUILD_POLL_INTERVAL_MS:1000}
kkrepo.repository-index-rebuild.batch-size=${KKREPO_REPOSITORY_INDEX_REBUILD_BATCH_SIZE:16}
kkrepo.pypi.index.sync-wait-ms=${KKREPO_PYPI_INDEX_SYNC_WAIT_MS:0}
kkrepo.maven.runtime-cache-ttl-seconds=${KKREPO_MAVEN_RUNTIME_CACHE_TTL_SECONDS:30}
kkrepo.blob-gc.enabled=${KKREPO_BLOB_GC_ENABLED:true}
kkrepo.blob-gc.poll-interval-ms=${KKREPO_BLOB_GC_POLL_INTERVAL_MS:30000}
kkrepo.blob-gc.batch-size=${KKREPO_BLOB_GC_BATCH_SIZE:64}
kkrepo.blob-gc.reconcile-scan-batch-size=${KKREPO_BLOB_GC_RECONCILE_SCAN_BATCH_SIZE:1024}
kkrepo.blob-gc.reconcile-mark-batch-size=${KKREPO_BLOB_GC_RECONCILE_MARK_BATCH_SIZE:${KKREPO_BLOB_GC_RECONCILE_BATCH_SIZE:256}}
kkrepo.blob-gc.deleted-grace-seconds=${KKREPO_BLOB_GC_DELETED_GRACE_SECONDS:3600}
kkrepo.blob-gc.claim-retry-seconds=${KKREPO_BLOB_GC_CLAIM_RETRY_SECONDS:600}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# Tetris collects the active application log only when it is named log_.
logging.file.name=/var/lib/jetty/logs/log_
logging.charset.file=UTF-8
logging.pattern.file=%d %p [%logger] - %m%n
logging.logback.rollingpolicy.file-name-pattern=/var/lib/jetty/logs/log_%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=500MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=5GB
