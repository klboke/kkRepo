kkrepo.cleanup.history.cleanup-delay=${KKREPO_CLEANUP_HISTORY_CLEANUP_DELAY:1h}
kkrepo.cleanup.history.initial-delay=${KKREPO_CLEANUP_HISTORY_INITIAL_DELAY:5m}
kkrepo.cleanup.usage.projection-delay-ms=${KKREPO_CLEANUP_USAGE_PROJECTION_DELAY_MS:60000}
kkrepo.cleanup.usage.projection-initial-delay-ms=${KKREPO_CLEANUP_USAGE_PROJECTION_INITIAL_DELAY_MS:1000}
kkrepo.cleanup.usage.projection-hint-delay-ms=${KKREPO_CLEANUP_USAGE_PROJECTION_HINT_DELAY_MS:1000}
kkrepo.cleanup.usage.projection-hint-initial-delay-ms=${KKREPO_CLEANUP_USAGE_PROJECTION_HINT_INITIAL_DELAY_MS:1000}
kkrepo.cleanup.usage.snapshot-delay-ms=${KKREPO_CLEANUP_USAGE_SNAPSHOT_DELAY_MS:1000}
kkrepo.cleanup.usage.snapshot-initial-delay-ms=${KKREPO_CLEANUP_USAGE_SNAPSHOT_INITIAL_DELAY_MS:1000}
kkrepo.cleanup.usage.coalescing-ttl=${KKREPO_CLEANUP_USAGE_COALESCING_TTL:5m}
kkrepo.cleanup.usage.safety-lag=${KKREPO_CLEANUP_USAGE_SAFETY_LAG:5m}
