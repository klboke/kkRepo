kkrepo.cleanup.worker.idle-base-delay=${KKREPO_CLEANUP_WORKER_IDLE_BASE_DELAY:500ms}
kkrepo.cleanup.worker.idle-max-delay=${KKREPO_CLEANUP_WORKER_IDLE_MAX_DELAY:10s}
kkrepo.cleanup.metrics-refresh=${KKREPO_CLEANUP_METRICS_REFRESH:15s}
kkrepo.cleanup.history.enabled=${KKREPO_CLEANUP_HISTORY_ENABLED:true}
kkrepo.cleanup.history.retention=${KKREPO_CLEANUP_HISTORY_RETENTION:90d}
kkrepo.cleanup.history.batch-size=${KKREPO_CLEANUP_HISTORY_BATCH_SIZE:25}
kkrepo.cleanup.history.max-batches-per-run=${KKREPO_CLEANUP_HISTORY_MAX_BATCHES_PER_RUN:10}
kkrepo.cleanup.history.minimum-runs-per-policy=${KKREPO_CLEANUP_HISTORY_MINIMUM_RUNS_PER_POLICY:10}
kkrepo.cleanup.history.item-batch-size=${KKREPO_CLEANUP_HISTORY_ITEM_BATCH_SIZE:5000}
