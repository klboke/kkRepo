server.tomcat.max-http-form-post-size=${KKREPO_TOMCAT_MAX_HTTP_FORM_POST_SIZE:1024MB}
server.tomcat.max-part-count=${KKREPO_TOMCAT_MAX_PART_COUNT:256}
spring.jackson.default-property-inclusion=non_null
spring.http.converters.preferred-json-mapper=jackson2
spring.jackson.time-zone=Asia/Shanghai
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.pool.size=${KKREPO_TASK_SCHEDULING_POOL_SIZE:4}
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.scheduler-name=kkrepo-cleanup
spring.quartz.auto-startup=${KKREPO_CLEANUP_QUARTZ_AUTO_STARTUP:true}
spring.quartz.overwrite-existing-jobs=false
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=${KKREPO_CLEANUP_QUARTZ_CLUSTER_CHECKIN_INTERVAL_MS:20000}
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=${KKREPO_CLEANUP_QUARTZ_MISFIRE_THRESHOLD_MS:60000}
spring.quartz.properties.org.quartz.threadPool.threadCount=${KKREPO_CLEANUP_QUARTZ_THREAD_COUNT:4}
