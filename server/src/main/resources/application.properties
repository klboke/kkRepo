kkrepo.cleanup.scheduler.enabled=${KKREPO_CLEANUP_SCHEDULER_ENABLED:true}
kkrepo.cleanup.scheduler.projection-delay-ms=${KKREPO_CLEANUP_SCHEDULER_PROJECTION_DELAY_MS:1000}
kkrepo.cleanup.scheduler.projection-initial-delay-ms=${KKREPO_CLEANUP_SCHEDULER_PROJECTION_INITIAL_DELAY_MS:1000}
kkrepo.cleanup.scheduler.reconcile-interval-ms=${KKREPO_CLEANUP_SCHEDULER_RECONCILE_INTERVAL_MS:60000}
kkrepo.cleanup.scheduler.reconcile-initial-delay-ms=${KKREPO_CLEANUP_SCHEDULER_RECONCILE_INITIAL_DELAY_MS:60000}
kkrepo.cleanup.scheduler.full-reconcile-min-interval-ms=${KKREPO_CLEANUP_SCHEDULER_FULL_RECONCILE_MIN_INTERVAL_MS:300000}
kkrepo.cleanup.worker.poll-delay-ms=${KKREPO_CLEANUP_WORKER_POLL_DELAY_MS:500}
kkrepo.cleanup.worker.initial-delay-ms=${KKREPO_CLEANUP_WORKER_INITIAL_DELAY_MS:1000}
kkrepo.cleanup.worker.batch-size=${KKREPO_CLEANUP_WORKER_BATCH_SIZE:2}
kkrepo.cleanup.worker.concurrency=${KKREPO_CLEANUP_WORKER_CONCURRENCY:2}
kkrepo.cleanup.worker.lease-duration=${KKREPO_CLEANUP_WORKER_LEASE_DURATION:2m}
kkrepo.cleanup.worker.heartbeat-interval=${KKREPO_CLEANUP_WORKER_HEARTBEAT_INTERVAL:20s}
kkrepo.cleanup.worker.retry-base-delay=${KKREPO_CLEANUP_WORKER_RETRY_BASE_DELAY:5s}
