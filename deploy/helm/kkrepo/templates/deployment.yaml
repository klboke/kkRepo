apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kkrepo.fullname" . }}
  labels:
    {{- include "kkrepo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "kkrepo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kkrepo.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kkrepo.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kkrepo
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: KKREPO_DATABASE_TYPE
              value: {{ .Values.database.type | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ required "database.url is required" .Values.database.url | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ required "database.username is required" .Values.database.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: KKREPO_CREDENTIAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "encryption.existingSecret is required" .Values.encryption.existingSecret }}
                  key: {{ .Values.encryption.credentialSecretKey }}
            - name: KKREPO_API_KEY_PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.encryption.existingSecret }}
                  key: {{ .Values.encryption.apiKeyPayloadSecretKey }}
            - name: KKREPO_FILE_ENABLED
              value: {{ .Values.blobStorage.file.enabled | quote }}
            - name: KKREPO_SECURITY_SCANNING_ENABLED
              value: {{ .Values.securityScanning.enabled | quote }}
            - name: KKREPO_SECURITY_SCANNING_METRICS_COUNT_LIMIT
              value: {{ .Values.securityScanning.metricsCountLimit | quote }}
            # The generic artifact-event projection and bounded retention remain active while
            # execution is disabled, so enabling later neither loses uploads nor grows the outbox.
            - name: KKREPO_SECURITY_SCANNING_ARTIFACT_CHANGE_BATCH_SIZE
              value: {{ .Values.securityScanning.worker.artifactChangeBatchSize | quote }}
            - name: KKREPO_SECURITY_SCANNING_ARTIFACT_CHANGE_CLEANUP_BATCH_SIZE
              value: {{ .Values.securityScanning.worker.artifactChangeCleanupBatchSize | quote }}
            - name: KKREPO_SECURITY_SCANNING_RETENTION_ENABLED
              value: {{ .Values.securityScanning.retention.enabled | quote }}
            - name: KKREPO_SECURITY_SCANNING_TERMINAL_TASK_RETENTION_DAYS
              value: {{ .Values.securityScanning.retention.terminalTaskDays | quote }}
            - name: KKREPO_SECURITY_SCANNING_RESULT_RETENTION_DAYS
              value: {{ .Values.securityScanning.retention.resultDays | quote }}
            - name: KKREPO_SECURITY_SCANNING_RETENTION_BATCH_SIZE
              value: {{ .Values.securityScanning.retention.batchSize | quote }}
            - name: KKREPO_SECURITY_SCANNING_RETENTION_DELAY
              value: {{ .Values.securityScanning.retention.delay | quote }}
            - name: KKREPO_SECURITY_SCANNING_RETENTION_INITIAL_DELAY
              value: {{ .Values.securityScanning.retention.initialDelay | quote }}
            {{- if .Values.securityScanning.enabled }}
            # Every run is routed to a stable scanner ordinal. Its cancel request therefore
            # reaches the same process-local execution registry even with multiple replicas.
            - name: KKREPO_SECURITY_SCANNING_ADAPTER_BASE_URLS
              value: {{ include "kkrepo.scannerBaseUrls" . | quote }}
            - name: KKREPO_SECURITY_SCANNING_SERVICE_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: {{ required "securityScanning.serviceCredential.existingSecret is required when scanning is enabled" .Values.securityScanning.serviceCredential.existingSecret }}
                  key: {{ required "securityScanning.serviceCredential.key is required when scanning is enabled" .Values.securityScanning.serviceCredential.key }}
            - name: KKREPO_SECURITY_SCANNING_OCI_REGISTRY_URL
              value: {{ printf "http://%s:%v" (include "kkrepo.fullname" .) .Values.service.httpPort | quote }}
            - name: KKREPO_SECURITY_SCANNING_DATABASE_MAX_AGE
              value: {{ .Values.securityScanning.scannerDatabase.maxAge | quote }}
            - name: KKREPO_SECURITY_SCANNING_OBSERVATION_MAX_AGE
              value: {{ .Values.securityScanning.scannerDatabase.observationMaxAge | quote }}
            - name: KKREPO_SECURITY_SCANNING_MAX_RESPONSE_BYTES
              value: {{ .Values.securityScanning.limits.maxResponseBytes | quote }}
            - name: KKREPO_SECURITY_SCANNING_WORKER_BATCH_SIZE
              value: {{ .Values.securityScanning.worker.batchSize | quote }}
            - name: KKREPO_SECURITY_SCANNING_WORKER_LEASE_SECONDS
              value: {{ .Values.securityScanning.worker.leaseSeconds | quote }}
            - name: KKREPO_SECURITY_SCANNING_WORKER_HEARTBEAT_SECONDS
              value: {{ .Values.securityScanning.worker.heartbeatSeconds | quote }}
            - name: KKREPO_SECURITY_SCANNING_WORKER_MAX_ATTEMPTS
              value: {{ .Values.securityScanning.worker.maxAttempts | quote }}
            - name: KKREPO_SECURITY_SCANNING_WORKER_MAX_BACKOFF_SECONDS
              value: {{ .Values.securityScanning.worker.maxBackoffSeconds | quote }}
            - name: KKREPO_SECURITY_SCANNING_CANDIDATE_BATCH_SIZE
              value: {{ .Values.securityScanning.worker.candidateBatchSize | quote }}
            - name: KKREPO_SECURITY_SCANNING_BACKFILL_BATCH_SIZE
              value: {{ .Values.securityScanning.worker.backfillBatchSize | quote }}
            - name: KKREPO_SECURITY_SCANNING_BACKFILL_MAX_PAGES_PER_RUN
              value: {{ .Values.securityScanning.worker.backfillMaxPagesPerRun | quote }}
            - name: KKREPO_SECURITY_SCANNING_SNAPSHOT_REMATCH_BATCH_SIZE
              value: {{ .Values.securityScanning.worker.snapshotRematchBatchSize | quote }}
            - name: KKREPO_SECURITY_SCANNING_SNAPSHOT_REMATCH_MAX_BATCHES
              value: {{ .Values.securityScanning.worker.snapshotRematchMaxBatches | quote }}
            {{- end }}
            {{- if .Values.blobStorage.file.enabled }}
            - name: KKREPO_FILE_BASE_DIR
              value: {{ .Values.blobStorage.file.mountPath | quote }}
            - name: KKREPO_FILE_PRODUCTION_ENABLED
              value: "true"
            - name: KKREPO_FILE_SHARED_FILESYSTEM
              value: "true"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.blobStorage.file.enabled }}
            - name: blobs
              mountPath: {{ .Values.blobStorage.file.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.blobStorage.file.enabled }}
        - name: blobs
          persistentVolumeClaim:
            claimName: {{ required "blobStorage.file.existingClaim is required when File storage is enabled" .Values.blobStorage.file.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
