{{- if .Values.securityScanning.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kkrepo.scannerName" . }}
  labels:
    {{- include "kkrepo.scannerLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kkrepo.scannerSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.securityScanning.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kkrepo.scannerHeadlessName" . }}
  labels:
    {{- include "kkrepo.scannerLabels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "kkrepo.scannerSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.securityScanning.service.port }}
      targetPort: http
{{- end }}
