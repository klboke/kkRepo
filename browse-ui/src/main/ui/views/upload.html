        <section class="view" id="upload-view">
          <div class="page-heading">
            <span class="heading-icon"><span class="lucide-icon icon-upload" aria-hidden="true"></span></span>
            <h1>Upload</h1>
            <span class="heading-copy">Upload content to the repository</span>
          </div>
          <div class="upload-layout">
            <form class="upload-form" id="upload-form">
              <label>
                <span>Repository</span>
                <select id="upload-repository" required></select>
              </label>
              <div class="upload-fields" id="upload-fields"></div>
              <button class="upload-button" id="upload-submit" type="submit">Upload</button>
              <div class="upload-status" id="upload-status" role="status"></div>
            </form>
          </div>
        </section>
