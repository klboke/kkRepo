        <section class="view" id="my-token-view">
          <div class="page-heading">
            <span class="heading-icon"><span class="lucide-icon icon-key-round" aria-hidden="true"></span></span>
            <h1>My Token</h1>
            <span class="heading-copy">API keys for package clients</span>
          </div>
          <div class="token-layout">
            <form class="token-panel token-form" id="my-token-form" novalidate>
              <label>
                <span>Domain</span>
                <select id="my-token-domain">
                  <option value="NpmToken">NpmToken</option>
                  <option value="CargoToken">CargoToken</option>
                  <option value="NuGetApiKey">NuGetApiKey</option>
                  <option value="PubToken">PubToken</option>
                  <option value="RubyGemsApiKey">RubyGemsApiKey</option>
                  <option value="GenericToken">GenericToken</option>
                  <option value="UserToken">UserToken (docker login and other Basic clients)</option>
                </select>
              </label>
              <label>
                <span>Display name <span class="required-mark">*</span></span>
                <input id="my-token-display-name" type="text" autocomplete="off" required aria-required="true">
              </label>
              <button class="upload-button" id="my-token-create" type="submit">Generate</button>
              <div class="token-status" id="my-token-status" role="status"></div>
            </form>

            <div class="token-panel token-secret" id="my-token-secret" hidden>
              <div class="token-secret-header">
                <div>
                  <div class="token-panel-title">Generated token</div>
                  <div class="token-note">Shown once after generate or reset.</div>
                  <div class="token-note" id="my-token-usage" hidden>User token: send the part before ":" as the username and the part after it as the password.</div>
                </div>
                <button class="secondary-button" id="my-token-copy" type="button">Copy</button>
              </div>
              <input class="token-value" id="my-token-value" type="text" readonly>
            </div>

            <div class="token-panel">
              <div class="token-panel-title">Current API keys</div>
              <div class="nx-table-frame token-table-frame">
                <table class="nx-table token-table">
                  <thead>
                    <tr>
                      <th>Domain</th>
                      <th>Name</th>
                      <th>Owner</th>
                      <th>Status</th>
                      <th>Prefix</th>
                      <th>Scopes</th>
                      <th>Updated</th>
                      <th class="token-actions-column">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="my-token-table"></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
