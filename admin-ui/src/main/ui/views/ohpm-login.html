        <section class="view" id="ohpm-login-view">
          <div class="page-heading">
            <span class="heading-icon"><span class="lucide-icon icon-key-round" aria-hidden="true"></span></span>
            <h1>Keys &amp; Tokens</h1>
            <span class="heading-copy">Bind RSA public keys to existing users for signed publication</span>
          </div>
          <nav class="credentials-tabs" aria-label="Keys and tokens sections">
            <a class="credentials-tab" href="#admin/security/api-keys">API Tokens</a>
            <a class="credentials-tab is-active" href="#admin/security/ohpm-login" aria-current="page">OHPM Public Keys</a>
          </nav>
          <div class="credentials-notice" id="ohpm-login-notice" role="status" hidden>
            <strong id="ohpm-login-configuration"></strong>
            <span id="ohpm-login-availability"></span>
            <span class="form-note" id="ohpm-login-timing"></span>
          </div>
          <div class="form-modal" id="ohpm-login-form-modal" data-form-id="ohpm-login-form" role="dialog" aria-modal="true" aria-labelledby="ohpm-login-form-title" hidden>
            <div class="form-modal-backdrop" data-modal-dismiss="ohpm-login-form"></div>
            <div class="form-modal-panel form-modal-panel-narrow">
              <button class="form-modal-close" data-modal-dismiss="ohpm-login-form" type="button" aria-label="Close dialog" title="Close dialog"><span class="lucide-icon icon-x" aria-hidden="true"></span></button>
          <form class="blobstore-form modal-form credentials-form" id="ohpm-login-form" hidden>
            <div class="form-title" id="ohpm-login-form-title">Register public key</div>
            <p class="form-note credentials-form-note" id="ohpm-login-mode"></p>
            <div class="form-grid">
              <label><span>User source</span><input id="ohpm-login-source" aria-label="User source" required maxlength="100"></label>
              <label><span>User ID</span><input id="ohpm-login-user" aria-label="User ID" required maxlength="255"></label>
              <p class="form-note full-width" id="ohpm-login-owner-status" role="status" aria-live="polite"></p>
              <label class="full-width"><span>RSA public key (X.509 PEM, 2048–8192 bits)</span><textarea id="ohpm-login-key" required rows="5" maxlength="16384" spellcheck="false" aria-describedby="ohpm-login-key-help"></textarea>
                <span class="form-note" id="ohpm-login-key-help">Paste the public key only. Keep the private key on the publishing machine.</span>
              </label>
            </div>
            <div class="form-actions">
              <button class="create-button" id="ohpm-login-save" type="submit" disabled>Register public key</button>
              <button class="create-button secondary" id="ohpm-login-cancel" type="button">Cancel</button>
            </div>
            <p class="form-note credentials-status" id="ohpm-login-form-status" role="status" aria-live="polite" aria-atomic="true"></p>
          </form>
            </div>
          </div>
          <div class="action-bar credentials-list-toolbar">
            <button class="create-button" id="ohpm-login-create" type="button" disabled aria-describedby="ohpm-login-availability"><span class="lucide-icon icon-plus" aria-hidden="true"></span> Register public key</button>
            <button class="create-button secondary" id="ohpm-login-refresh" type="button"><span class="lucide-icon icon-refresh-cw" aria-hidden="true"></span> Refresh</button>
            <span class="form-note credentials-status" id="ohpm-login-status" role="status" aria-live="polite" aria-atomic="true"></span>
          </div>
          <div class="nx-table-frame credentials-key-list">
            <table class="nx-table compact" id="ohpm-login-table" hidden>
              <thead><tr><th>User</th><th>Publish ID</th><th>SHA-256 fingerprint</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody id="ohpm-login-rows"></tbody>
            </table>
            <div class="credentials-empty" id="ohpm-login-empty" hidden>
              <strong>No public keys registered.</strong>
              <p class="form-note">Register a public key to use OHPM signed login.</p>
            </div>
          </div>
          <div class="pagination-bar" id="ohpm-login-pagination" hidden>
            <span class="pagination-summary" id="ohpm-login-page"></span>
            <button class="row-action" id="ohpm-login-previous" type="button" title="Previous page" aria-label="Previous page"><span class="lucide-icon icon-chevron-left" aria-hidden="true"></span></button>
            <span class="pagination-page" id="ohpm-login-page-label">Page 1</span>
            <button class="row-action" id="ohpm-login-next" type="button" title="Next page" aria-label="Next page"><span class="lucide-icon icon-chevron-right" aria-hidden="true"></span></button>
            <label class="select-filter pagination-size"><span>Rows</span><select id="ohpm-login-page-size"><option value="10" selected>10</option><option value="15">15</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></label>
          </div>
        </section>
