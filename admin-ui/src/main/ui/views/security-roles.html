        <section class="view" id="security-roles-view">
          <div class="page-heading">
            <span class="heading-icon"><span class="lucide-icon icon-shield-check" aria-hidden="true"></span></span>
            <h1>Roles</h1>
            <span class="heading-copy">Manage role privileges and inherited roles</span>
          </div>
          <div class="action-bar">
            <button class="create-button" id="create-security-role-button" type="button"><span class="lucide-icon icon-plus" aria-hidden="true"></span> Create role</button>
            <label class="filter-box"><span class="filter-icon lucide-icon icon-list-filter" aria-hidden="true"></span><input id="security-role-filter" type="search" placeholder="Filter"></label>
          </div>
          <div class="form-modal" id="security-role-form-modal" data-form-id="security-role-form" role="dialog" aria-modal="true" aria-labelledby="security-role-form-title" hidden>
            <div class="form-modal-backdrop" data-modal-dismiss="security-role-form"></div>
            <div class="form-modal-panel">
              <button class="form-modal-close" data-modal-dismiss="security-role-form" type="button" aria-label="Close dialog" title="Close dialog"><span class="lucide-icon icon-x" aria-hidden="true"></span></button>
          <form class="blobstore-form modal-form" id="security-role-form" hidden novalidate>
            <div class="form-title" id="security-role-form-title">Create role</div>
            <div class="form-grid">
              <label><span>Role ID <span class="required-mark">*</span></span><input id="security-role-id" type="text" required></label>
              <label><span>Name</span><input id="security-role-name" type="text"></label>
              <label><span>Description</span><input id="security-role-description" type="text"></label>
              <input id="security-role-privileges" type="hidden">
              <input id="security-role-roles" type="hidden">
              <div class="full-width role-transfer-section">
                <div class="role-transfer-title">Privileges</div>
                <div class="member-transfer role-transfer" id="role-privilege-transfer">
                  <div class="member-pane" data-side="available">
                    <div class="member-pane-head">
                      <span class="member-pane-title">Available <span class="member-count" id="role-privilege-available-count">0</span></span>
                    </div>
                    <input type="search" class="member-filter" id="role-privilege-filter" placeholder="Filter privileges..." autocomplete="off">
                    <ul class="member-list" id="role-privilege-available-list" tabindex="0" aria-label="Available privileges"></ul>
                  </div>
                  <div class="member-actions" role="group" aria-label="Move privileges">
                    <button type="button" class="member-action" id="role-privilege-add-all" title="Add all">&raquo;</button>
                    <button type="button" class="member-action" id="role-privilege-add" title="Add selected">&rsaquo;</button>
                    <button type="button" class="member-action" id="role-privilege-remove" title="Remove selected">&lsaquo;</button>
                    <button type="button" class="member-action" id="role-privilege-remove-all" title="Remove all">&laquo;</button>
                  </div>
                  <div class="member-pane" data-side="selected">
                    <div class="member-pane-head">
                      <span class="member-pane-title">Given <span class="member-count" id="role-privilege-selected-count">0</span></span>
                    </div>
                    <ul class="member-list" id="role-privilege-selected-list" tabindex="0" aria-label="Given privileges"></ul>
                  </div>
                </div>
              </div>
              <div class="full-width role-transfer-section">
                <div class="role-transfer-title">Roles</div>
                <div class="member-transfer role-transfer" id="role-contained-transfer">
                  <div class="member-pane" data-side="available">
                    <div class="member-pane-head">
                      <span class="member-pane-title">Available <span class="member-count" id="role-contained-available-count">0</span></span>
                    </div>
                    <input type="search" class="member-filter" id="role-contained-filter" placeholder="Filter roles..." autocomplete="off">
                    <ul class="member-list" id="role-contained-available-list" tabindex="0" aria-label="Available roles"></ul>
                  </div>
                  <div class="member-actions" role="group" aria-label="Move roles">
                    <button type="button" class="member-action" id="role-contained-add-all" title="Add all">&raquo;</button>
                    <button type="button" class="member-action" id="role-contained-add" title="Add selected">&rsaquo;</button>
                    <button type="button" class="member-action" id="role-contained-remove" title="Remove selected">&lsaquo;</button>
                    <button type="button" class="member-action" id="role-contained-remove-all" title="Remove all">&laquo;</button>
                  </div>
                  <div class="member-pane" data-side="selected">
                    <div class="member-pane-head">
                      <span class="member-pane-title">Contained <span class="member-count" id="role-contained-selected-count">0</span></span>
                    </div>
                    <ul class="member-list" id="role-contained-selected-list" tabindex="0" aria-label="Contained roles"></ul>
                  </div>
                </div>
              </div>
              <section class="full-width role-transfer-section" aria-labelledby="security-role-mappings-title">
                <div class="role-transfer-title field-label">
                  <span id="security-role-mappings-title">External mappings (LDAP/OIDC)</span>
                  <span class="field-help" tabindex="0" role="note"
                    aria-label="About external role mappings"
                    data-tooltip="Map an exact external role or group name to this role. For browser sessions, LDAP and OIDC group membership changes apply after the user signs in again. Changes to kkRepo mappings apply on the next request."><span class="lucide-icon icon-info" aria-hidden="true"></span></span>
                </div>
                <div id="security-role-mappings" class="security-role-mappings"></div>
                <div><button class="create-button secondary" id="add-security-role-mapping" type="button">Add mapping</button></div>
              </section>
              <label class="checkbox-field" id="security-role-readonly-field" hidden><input id="security-role-readonly" type="checkbox" disabled><span>Read only</span></label>
            </div>
            <div class="form-actions">
              <button class="create-button" id="save-security-role-button" type="button">Save role</button>
              <button class="create-button secondary" id="edit-security-role-mappings" type="button" hidden>Edit mappings</button>
              <button class="create-button secondary" id="view-security-role-users" type="button" hidden>View users with this role</button>
              <button class="create-button secondary" id="cancel-security-role-button" type="button">Cancel</button>
            </div>
          </form>
            </div>
          </div>
          <div class="nx-table-frame">
            <table class="nx-table">
              <thead><tr><th>Role ID</th><th>Name</th><th>Description</th><th>External mappings (LDAP/OIDC)</th><th class="actions-column">Actions</th></tr></thead>
              <tbody id="security-role-table"></tbody>
            </table>
          </div>
        </section>
